<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SUQNA - Pasar Kita, Untuk Semua</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        body { -webkit-tap-highlight-color: transparent; background-color: #f3f4f6; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        .slide-up { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(50px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    </style>
</head>
<body class="text-gray-800 font-sans flex justify-center min-h-screen items-start sm:items-center">

    <div id="app" class="w-full max-w-md h-[100dvh] sm:h-[90vh] mx-auto bg-white relative sm:shadow-2xl sm:rounded-[2.5rem] sm:border-8 border-gray-800 overflow-hidden flex flex-col">
        
        <!-- Toast Notification -->
        <div id="toast" class="hidden absolute top-20 left-1/2 transform -translate-x-1/2 bg-gray-900/90 backdrop-blur text-white px-5 py-3 rounded-full text-xs font-bold z-[100] shadow-2xl transition-all whitespace-nowrap flex items-center gap-2 border border-gray-700">
            <i data-lucide="info" class="w-4 h-4 text-emerald-400"></i>
            <span id="toast-msg">Notifikasi</span>
        </div>

        <!-- Modal Success -->
        <div id="modal" class="hidden absolute inset-0 bg-black/60 z-[100] flex items-center justify-center p-4 backdrop-blur-sm transition-opacity">
            <div class="bg-white rounded-[2rem] p-7 max-w-[85%] w-full text-center shadow-2xl transform scale-100 transition-transform slide-up">
                <div class="w-16 h-16 bg-[#009669]/10 text-[#009669] rounded-full flex items-center justify-center mx-auto mb-5">
                    <i data-lucide="check-circle" class="w-8 h-8"></i>
                </div>
                <h3 id="modal-title" class="text-xl font-black text-gray-900 mb-2">Sukses</h3>
                <p id="modal-desc" class="text-sm text-gray-500 font-medium mb-6 leading-relaxed">Operasi berhasil dilakukan.</p>
                
                <div class="space-y-3">
                    <a id="modal-wa-btn" href="#" target="_blank" class="hidden w-full bg-[#25D366] text-white font-extrabold py-3.5 rounded-2xl hover:bg-[#1DA851] transition-colors shadow-lg shadow-green-200 flex items-center justify-center gap-2">
                        <i data-lucide="message-circle" class="w-5 h-5"></i> Chat Penjual ke WA
                    </a>
                    <button onclick="window.closeModal()" class="w-full bg-gray-100 text-gray-700 font-extrabold py-3.5 rounded-2xl hover:bg-gray-200 transition-colors">
                        Tutup Layar
                    </button>
                </div>
            </div>
        </div>

        <!-- Modal Review / Ulasan -->
        <div id="review-modal" class="hidden absolute inset-0 bg-black/60 z-[100] flex items-center justify-center p-4 backdrop-blur-sm transition-opacity">
            <div class="bg-white rounded-[2rem] p-6 max-w-[85%] w-full text-center shadow-2xl transform scale-100 transition-transform slide-up">
                <h3 class="text-xl font-black text-gray-900 mb-2">Pesanan Diterima!</h3>
                <p class="text-xs text-gray-500 font-medium mb-5">Bagaimana pengalaman belanja Anda?</p>
                
                <div class="flex justify-center gap-2 mb-6">
                    <i id="star-1" onclick="window.highlightStars(1)" data-lucide="star" class="w-8 h-8 text-gray-300 cursor-pointer transition-colors"></i>
                    <i id="star-2" onclick="window.highlightStars(2)" data-lucide="star" class="w-8 h-8 text-gray-300 cursor-pointer transition-colors"></i>
                    <i id="star-3" onclick="window.highlightStars(3)" data-lucide="star" class="w-8 h-8 text-gray-300 cursor-pointer transition-colors"></i>
                    <i id="star-4" onclick="window.highlightStars(4)" data-lucide="star" class="w-8 h-8 text-gray-300 cursor-pointer transition-colors"></i>
                    <i id="star-5" onclick="window.highlightStars(5)" data-lucide="star" class="w-8 h-8 text-gray-300 cursor-pointer transition-colors"></i>
                </div>
                
                <textarea id="review-text" rows="3" placeholder="Tulis komentar Anda di sini (opsional)..." class="w-full bg-gray-50 border border-gray-200 rounded-2xl px-4 py-3 text-sm font-medium text-gray-800 focus:ring-2 focus:ring-[#009669]/50 outline-none transition-all mb-4"></textarea>
                
                <div class="space-y-3">
                    <button onclick="window.submitReview()" class="w-full bg-[#009669] text-white font-extrabold py-3.5 rounded-2xl hover:bg-emerald-700 transition-colors shadow-lg shadow-emerald-200">
                        Kirim Ulasan
                    </button>
                    <button onclick="window.closeReviewModal()" class="w-full bg-gray-100 text-gray-700 font-extrabold py-3.5 rounded-2xl hover:bg-gray-200 transition-colors">
                        Batal
                    </button>
                </div>
            </div>
        </div>

        <!-- Main Content Area -->
        <main id="content" class="flex-1 overflow-y-auto overflow-x-hidden relative bg-white pb-28 transition-all duration-300 hide-scroll">
        </main>

        <nav id="bottom-nav" class="absolute bottom-0 w-full bg-white border-t border-gray-100 flex justify-around px-2 pt-2 pb-4 shadow-[0_-10px_40px_rgba(0,0,0,0.06)] z-[60] pb-safe transition-transform duration-300 items-end">
            <!-- Beranda -->
            <button onclick="window.navigate('home')" id="nav-home" class="flex flex-col items-center gap-1 transition-colors w-[20%] group mb-1">
                <i data-lucide="home" class="w-6 h-6 text-[#009669] group-active:scale-95 transition-transform"></i>
                <span class="text-[10px] font-bold text-[#009669]">Beranda</span>
            </button>
            
            <!-- Kategori -->
            <button onclick="window.navigate('home'); setTimeout(() => { const catSec = document.getElementById('kategori-section'); if(catSec) document.getElementById('content').scrollTo({top: catSec.offsetTop - 20, behavior: 'smooth'}); }, 50);" id="nav-kategori" class="flex flex-col items-center gap-1 transition-colors w-[20%] group mb-1">
                <i data-lucide="layout-grid" class="w-6 h-6 text-gray-400 group-hover:text-gray-600 group-active:scale-95 transition-all"></i>
                <span class="text-[10px] font-medium text-gray-400">Kategori</span>
            </button>
            
            <!-- JUAL (Tombol Hijau Besar di Tengah) -->
            <div class="relative w-[20%] flex justify-center h-full">
                <button onclick="window.navigate('seller_center')" id="nav-jual" class="absolute bottom-4 flex flex-col items-center justify-center w-[3.5rem] h-[3.5rem] bg-[#009669] rounded-full text-white shadow-[0_8px_20px_rgba(0,150,105,0.4)] border-[5px] border-white active:scale-95 transition-transform z-20 group">
                    <i data-lucide="plus" class="w-7 h-7 group-hover:rotate-90 transition-transform duration-300"></i>
                </button>
                <span class="text-[10px] font-medium text-gray-400 absolute bottom-1">Jual</span>
            </div>

            <!-- Keranjang -->
            <button onclick="window.navigate('cart')" id="nav-cart" class="flex flex-col items-center gap-1 transition-colors w-[20%] relative group mb-1">
                <div id="cart-badge" class="hidden absolute -top-1.5 right-2 bg-red-500 text-white text-[9px] font-bold w-4 h-4 flex items-center justify-center rounded-full shadow-sm border-2 border-white">0</div>
                <i data-lucide="shopping-cart" class="w-6 h-6 text-gray-400 group-hover:text-gray-600 group-active:scale-95 transition-all"></i>
                <span class="text-[10px] font-medium text-gray-400">Keranjang</span>
            </button>
            
            <!-- Akun -->
            <button onclick="window.navigate('account')" id="nav-account" class="flex flex-col items-center gap-1 transition-colors w-[20%] group mb-1">
                <i data-lucide="user" class="w-6 h-6 text-gray-400 group-hover:text-gray-600 group-active:scale-95 transition-all"></i>
                <span class="text-[10px] font-medium text-gray-400">Akun</span>
            </button>
        </nav>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, deleteDoc, doc, updateDoc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAJBYNDoW3lT0mHvO3gH5WKZoEMWTFs_5M",
            authDomain: "suqna-d8344.firebaseapp.com",
            projectId: "suqna-d8344",
            storageBucket: "suqna-d8344.firebasestorage.app",
            messagingSenderId: "424982355557",
            appId: "1:424982355557:web:9d1574c87d49eb2a2a708c"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const googleProvider = new GoogleAuthProvider();

        // State Management
        window.currentView = 'home';
        window.userId = null; 
        window.userEmail = "";
        window.isAdmin = false; 
        window.isAddingProduct = false; 
        window.isEditingProfile = false; 
        window.isEditingBuyerProfile = false; 
        window.currentProductDetail = null;
        window.isStoreUnlocked = false; 
        window.editingProductData = null;
        
        // Modal Ulasan
        window.currentReviewOrderId = null;
        window.currentReviewProductId = null;
        window.selectedRating = 0;
        
        // Profiles
        window.storeProfile = { name: "Toko Baru", phone: "", avatar: "" };
        window.userProfile = { name: "", address: "", avatar: "" }; 

        window.tempUploadedAvatar = '';
        window.tempProductImg = '';
        window.tempBannerImg = ''; 
        
        window.currentSearchQuery = '';
        window.currentCategoryFilter = 'Semua';
        window.authMode = 'login';

        // Data Storage
        window.products = [];
        window.cart = [];
        window.myOrders = [];
        window.incomingOrders = [];
        window.reviews = [];
        window.firestoreBanners = [];
        window.toastTimeout = null;
        const appId = 'suqna-v2';

        // Banner Default
        window.defaultBanners = [
            { tag: "TETANGGAKU", tagColor: "text-[#00c98f]", title: "Sayur Segar<br>Tiap Pagi", img: "https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&q=80&w=800" },
            { tag: "PROMO BERKAH", tagColor: "text-amber-400", title: "Kurma Ajwa<br>Diskon 30%", img: "https://images.unsplash.com/photo-1589539148230-0a5b707bc77c?auto=format&fit=crop&q=80&w=800" },
            { tag: "PROPERTI", tagColor: "text-blue-400", title: "Rumah Idaman<br>Keluarga", img: "https://images.unsplash.com/photo-1512917774080-9991f1c4c750?auto=format&fit=crop&q=80&w=800" }
        ];
        
        window.banners = [...window.defaultBanners]; 
        window.currentBannerIndex = 0;
        window.bannerInterval = null;

        window.categories = [
            { name: "Semua", icon: "layout-grid", bg: "bg-[#009669]", textColor: "text-[#009669] font-bold", iconColor: "text-white" },
            { name: "Belanja & Retail", icon: "shopping-bag", bg: "bg-orange-50", textColor: "text-gray-600 font-medium", iconColor: "text-orange-500" },
            { name: "Kendaraan", icon: "car", bg: "bg-blue-50", textColor: "text-gray-600 font-medium", iconColor: "text-blue-500" },
            { name: "Properti", icon: "building-2", bg: "bg-indigo-50", textColor: "text-gray-600 font-medium", iconColor: "text-indigo-500" },
            { name: "Pendidikan", icon: "book-open", bg: "bg-yellow-50", textColor: "text-gray-600 font-medium", iconColor: "text-yellow-600" },
            { name: "Bisnis & Grosir", icon: "briefcase", bg: "bg-purple-50", textColor: "text-gray-600 font-medium", iconColor: "text-purple-500" },
            { name: "Hobi & Gaya Hidup", icon: "heart", bg: "bg-pink-50", textColor: "text-gray-600 font-medium", iconColor: "text-pink-500" },
            { name: "Produk Digital", icon: "monitor", bg: "bg-cyan-50", textColor: "text-gray-600 font-medium", iconColor: "text-cyan-500" },
            { name: "Jasa & Layanan", icon: "wrench", bg: "bg-green-50", textColor: "text-gray-600 font-medium", iconColor: "text-green-500" },
            { name: "Perjalanan & Wisata", icon: "plane", bg: "bg-teal-50", textColor: "text-gray-600 font-medium", iconColor: "text-teal-500" },
            { name: "Kuliner & Makanan", icon: "utensils", bg: "bg-red-50", textColor: "text-gray-600 font-medium", iconColor: "text-red-500" },
            { name: "Barang Bekas", icon: "archive", bg: "bg-amber-50", textColor: "text-gray-600 font-medium", iconColor: "text-amber-600" },
            { name: "Lainnya", icon: "more-horizontal", bg: "bg-gray-100", textColor: "text-gray-600 font-medium", iconColor: "text-gray-500" }
        ];

        window.categoryData = {
            "Belanja & Retail": ["Logam Mulia & Emas", "Fashion & Busana", "Kesehatan & Kecantikan", "Elektronik & Gadget", "Kebutuhan Rumah Tangga"],
            "Kendaraan": ["Mobil Baru", "Mobil Bekas", "Motor Baru", "Motor Bekas", "Aksesoris & Suku Cadang", "Rental Kendaraan"],
            "Properti": ["Rumah Dijual", "Rumah Disewakan / Kontrakan", "Tanah", "Apartemen / Kos-kosan", "Ruko & Komersial"],
            "Pendidikan": ["Buku & Alat Tulis", "Kursus & Bimbel", "Perlengkapan Sekolah", "Seragam"],
            "Bisnis & Grosir": ["Peluang Franchise", "Grosir Sembako", "Perlengkapan Usaha / Toko", "Bahan Baku"],
            "Hobi & Gaya Hidup": ["Olahraga & Outdoor", "Mainan & Koleksi", "Alat Musik", "Hewan Peliharaan", "Seni & Kerajinan"],
            "Produk Digital": ["Pulsa & Paket Data", "Token Listrik & PPOB", "Top-up Game", "Voucher Digital"],
            "Jasa & Layanan": ["Servis Elektronik & Kendaraan", "Desain & IT (Freelance)", "Jasa Fotografi & Video", "Jasa Kebersihan", "Kuliner Pesanan Khusus"],
            "Perjalanan & Wisata": ["Paket Umroh & Haji", "Tiket Transportasi", "Voucher Hotel & Penginapan", "Paket Wisata"],
            "Kuliner & Makanan": ["Makanan Siap Saji", "Kue & Jajanan", "Bahan Pokok", "Katering", "Minuman Segar"],
            "Barang Bekas": ["Pakaian & Aksesoris Bekas", "Elektronik Bekas", "Buku Bekas", "Perabotan Bekas"],
            "Lainnya": ["Lain-lain / Umum"]
        };

        // Fetch Banners
        const bannersQuery = query(collection(db, 'artifacts', appId, 'public', 'data', 'banners'));
        onSnapshot(bannersQuery, (snapshot) => {
            window.firestoreBanners = [];
            snapshot.forEach((doc) => { window.firestoreBanners.push({ id: doc.id, ...doc.data() }); });
            
            if (window.firestoreBanners.length > 0) {
                window.firestoreBanners.sort((a,b) => (a.timestamp || 0) - (b.timestamp || 0));
                window.banners = window.firestoreBanners;
            } else {
                window.banners = [...window.defaultBanners];
            }
            if(window.render) window.render();
        }, (e) => console.error(e));

        const productsQuery = query(collection(db, 'artifacts', appId, 'public', 'data', 'products'));
        onSnapshot(productsQuery, (snapshot) => {
            window.products = [];
            snapshot.forEach((doc) => { window.products.push({ id: doc.id, ...doc.data() }); });
            window.products.sort((a,b) => (b.timestamp || 0) - (a.timestamp || 0));
            if(window.render) window.render();
        }, (e) => console.error(e));

        const reviewsQuery = query(collection(db, 'artifacts', appId, 'public', 'data', 'reviews'));
        onSnapshot(reviewsQuery, (snapshot) => {
            window.reviews = [];
            snapshot.forEach((doc) => { window.reviews.push({ id: doc.id, ...doc.data() }); });
            if(window.render) window.render();
        }, (e) => console.error(e));

        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.userId = user.uid;
                window.userEmail = user.email;
                window.isAdmin = (user.email === 'rba.indonesia26@gmail.com');
                
                const storeRef = doc(db, 'artifacts', appId, 'users', window.userId, 'profile', 'store_info');
                onSnapshot(storeRef, (docSnap) => {
                    if (docSnap.exists()) {
                        window.storeProfile = docSnap.data();
                        if (window.storeProfile.name && window.storeProfile.name !== "Toko Baru") window.isStoreUnlocked = true;
                    } else {
                        window.storeProfile = { name: "Toko Baru", phone: "", avatar: "" };
                        window.isStoreUnlocked = false;
                    }
                    if(window.render) window.render();
                });

                const buyerRef = doc(db, 'artifacts', appId, 'users', window.userId, 'profile', 'buyer_info');
                onSnapshot(buyerRef, (docSnap) => {
                    if (docSnap.exists()) {
                        window.userProfile = docSnap.data();
                    } else {
                        window.userProfile = { name: "", address: "", avatar: "" };
                    }
                    if(window.render) window.render();
                });

                const ordersQuery = query(collection(db, 'artifacts', appId, 'users', window.userId, 'orders'));
                onSnapshot(ordersQuery, (snapshot) => {
                    window.myOrders = [];
                    snapshot.forEach((doc) => { window.myOrders.push({ id: doc.id, ...doc.data() }); });
                    window.myOrders.sort((a,b) => (b.timestamp || 0) - (a.timestamp || 0));
                    if(window.render) window.render();
                });

                const incomingQuery = query(collection(db, 'artifacts', appId, 'public', 'data', 'orders'));
                onSnapshot(incomingQuery, (snapshot) => {
                    window.incomingOrders = [];
                    snapshot.forEach((doc) => {
                        const dat = doc.data();
                        if (dat.storeOwnerId === window.userId) window.incomingOrders.push({ id: doc.id, ...dat });
                    });
                    window.incomingOrders.sort((a,b) => (b.timestamp || 0) - (a.timestamp || 0));
                    if(window.render) window.render();
                });
                
            } else {
                window.userId = null;
                window.userEmail = "";
                window.isAdmin = false;
                window.storeProfile = { name: "Toko Baru", phone: "", avatar: "" };
                window.userProfile = { name: "", address: "", avatar: "" };
                window.isStoreUnlocked = false;
                window.myOrders = [];
                window.incomingOrders = [];
                
                if(window.currentView === 'account' || window.currentView === 'seller_center' || window.currentView === 'cart' || window.currentView === 'admin_dashboard') {
                    window.currentView = 'login';
                }
            }
            if(window.render) window.render();
        });

        window.navigate = function(view) { 
            if ((view === 'account' || view === 'seller_center' || view === 'cart' || view === 'admin_dashboard') && !window.userId) {
                window.currentView = 'login';
            } else {
                window.currentView = view; 
            }
            window.render(); 
        }

        window.addToCart = function(id) {
            let p = window.products.find(x => x.id === id);
            if(p) {
                window.cart.push({ ...p });
                window.showToastMessage('Berhasil ditambahkan ke keranjang!');
                if(window.render) window.render();
            }
        }

        window.openProductDetail = function(id) {
            let p = window.products.find(x => x.id === id);
            if(p) {
                window.currentProductDetail = p;
                window.currentView = 'detail';
                window.render();
            }
        }

        window.buildHorizontalProductCard = function(p) {
            const price = p.price || 0;
            const prodReviews = window.reviews.filter(r => r.productId === p.id);
            const avgRating = prodReviews.length > 0 ? (prodReviews.reduce((sum, r) => sum + r.rating, 0) / prodReviews.length).toFixed(1) : 0;
            const ratingHtml = prodReviews.length > 0 ? `<div class="flex items-center gap-1 bg-amber-50 px-1.5 py-0.5 rounded text-[9px] font-bold text-amber-600"><i data-lucide="star" class="w-2.5 h-2.5 fill-amber-500 text-amber-500"></i> ${avgRating}</div>` : '';

            return `
                <div onclick="window.openProductDetail('${p.id}')" class="min-w-[150px] w-[150px] bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden flex flex-col relative cursor-pointer snap-start hover:shadow-md transition-shadow">
                    <div class="h-32 bg-gray-50 relative w-full overflow-hidden group">
                        <img src="${p.imgUrl}" alt="${p.name}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500"/>
                        <div class="absolute top-2 left-2 bg-white/90 backdrop-blur-sm text-[#009669] text-[8px] font-extrabold px-2 py-1 rounded-full uppercase shadow-sm max-w-[80%] truncate border border-emerald-50">${p.category || 'Lainnya'}</div>
                    </div>
                    <div class="p-3 flex flex-col flex-1">
                        <div class="flex justify-between items-start mb-1.5">
                            <h3 class="font-bold text-[13px] text-gray-800 leading-[1.3] line-clamp-2">${p.name}</h3>
                        </div>
                        <div class="flex items-center justify-between mb-2 mt-auto">
                            <div class="flex items-center gap-1.5">
                                <i data-lucide="store" class="w-3 h-3 text-gray-400"></i>
                                <span class="text-[9px] font-medium text-gray-500 truncate max-w-[60px]">${p.storeName || 'Online'}</span>
                            </div>
                            ${ratingHtml}
                        </div>
                        <div class="pt-2 border-t border-gray-50 flex items-center justify-between">
                            <p class="text-[#009669] font-black text-[13px]">Rp ${price.toLocaleString('id-ID')}</p>
                            <button onclick="event.stopPropagation(); window.addToCart('${p.id}')" class="w-7 h-7 bg-emerald-50 text-emerald-600 rounded-full flex items-center justify-center hover:bg-emerald-100 transition-colors">
                                <i data-lucide="plus" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        window.render = function() {
            const content = document.getElementById('content');
            const bottomNav = document.getElementById('bottom-nav');
            if(!content) return;
            
            content.classList.add('fade-in');
            setTimeout(() => content.classList.remove('fade-in'), 200);

            if (window.currentView === 'home') {
                content.innerHTML = window.renderHome();
                bottomNav.style.transform = 'translateY(0)';
                content.classList.replace('pb-0', 'pb-28');
                window.startBannerSlide(); 
            } else if (window.currentView === 'login') {
                content.innerHTML = window.renderLogin();
                bottomNav.style.transform = 'translateY(150%)'; 
                content.classList.replace('pb-28', 'pb-0');
                window.stopBannerSlide();
            } else if (window.currentView === 'detail' || window.currentView === 'seller_center' || window.currentView === 'admin_dashboard') {
                if (window.currentView === 'detail') content.innerHTML = window.renderProductDetail();
                if (window.currentView === 'seller_center') content.innerHTML = window.renderSellerCenter();
                if (window.currentView === 'admin_dashboard') content.innerHTML = window.renderAdminDashboard();
                bottomNav.style.transform = 'translateY(150%)'; 
                content.classList.replace('pb-28', 'pb-0');

            const prodReviews = window.reviews.filter(r => r.productId === p.id);
            const avgRating = prodReviews.length > 0 ? (prodReviews.reduce((sum, r) => sum + r.rating, 0) / prodReviews.length).toFixed(1) : 0;
            
            let reviewsHtml = `<div class="mt-6 border-t border-gray-100 pt-6">

                </h3>
                <div class="space-y-4">
                    ${prodReviews.length === 0 ? '<p class="text-sm text-gray-400 font-medium text-center py-4 bg-gray-50 rounded-2xl border border-dashed border-gray-200">Belum ada ulasan untuk barang ini.</p>' : prodReviews.map(r => `
                        <div class="bg-gray-50 p-4 rounded-2xl border border-gray-100 shadow-sm">
                            <div class="flex items-center justify-between mb-3">
                                <div class="flex items-center gap-2">
                                    <div class="w-7 h-7 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center text-[10px] font-black">${(r.reviewerName || 'A').charAt(0).toUpperCase()}</div>
                                    <span class="text-xs font-bold text-gray-800">${r.reviewerName || 'Anonim'}</span>
                                </div>
                                <div class="flex gap-0.5">
                                    ${Array(5).fill(0).map((_,i) => `<i data-lucide="star" class="w-3.5 h-3.5 ${i < r.rating ? 'fill-amber-400 text-amber-400' : 'text-gray-300'}"></i>`).join('')}
                                </div>
                            </div>
                            <p class="text-xs text-gray-600 font-medium leading-relaxed">${r.comment || ''}</p>
                        </div>
                    `).join('')}
                </div>
            `;

            return `
                <div class="relative w-full h-[380px] bg-gray-100">
                    <button onclick="window.navigate('home')" class="absolute top-6 left-4 z-20 w-10 h-10 bg-white/90 backdrop-blur rounded-full shadow-md flex items-center justify-center text-gray-800 hover:bg-white transition-colors">
                        <i data-lucide="arrow-left" class="w-5 h-5"></i>
                    </button>
                    <img src="${p.imgUrl}" alt="${p.name}" class="w-full h-full object-cover">
                </div>
                <div class="bg-white -mt-6 relative z-10 rounded-t-[2rem] px-5 pt-8 pb-32 shadow-[0_-10px_20px_rgba(0,0,0,0.05)]">
                    <div class="flex items-center gap-2 mb-3">
                        <span class="bg-emerald-50 text-emerald-600 border border-emerald-100 text-[10px] font-black px-2.5 py-1 rounded-full uppercase">${p.category || 'Lainnya'}</span>
                        ${prodReviews.length > 0 && avgRating >= 4.5 ? `<span class="bg-amber-50 text-amber-600 border border-amber-100 text-[10px] font-black px-2.5 py-1 rounded-full flex items-center gap-1"><i data-lucide="check-circle" class="w-3 h-3"></i> Terpercaya</span>` : ''}
                    </div>
                    <h1 class="text-2xl font-black text-gray-900 leading-tight mb-3">${p.name}</h1>
                    <p class="text-[#009669] font-black text-3xl mb-5">Rp ${price.toLocaleString('id-ID')}</p>
                    
                    <div class="w-full h-[1px] bg-gray-100 mb-6"></div>

                    <button onclick="window.processCheckout()" class="w-full bg-[#009669] text-white font-extrabold text-lg py-4 rounded-2xl shadow-lg shadow-emerald-200 hover:bg-emerald-700 transition-colors active:scale-95">Checkout Sekarang</button>

        window.removeFromCart = function(index) {
            window.cart.splice(index, 1);
            window.render();
        }

        window.filterCategory = function(catName) {
            window.currentCategoryFilter = catName;
            window.render();
        }

        window.handleSearch = function(val) {
            window.currentSearchQuery = val;
            window.render();
        }

        window.processCheckout = async function() {
            if(window.cart.length > 0) {
                if(!window.userId) {
                    window.showToastMessage('Silakan masuk/daftar terlebih dahulu!');
                    window.navigate('login');
                    return;
                }
                const totalAmount = window.cart.reduce((s,i)=>s+i.price,0);
                const firstItem = window.cart[0];
                const orderId = 'ORD-' + Math.random().toString(36).substr(2, 9).toUpperCase();
                
                const order = { 
                    items: window.cart, totalAmount: totalAmount, status: 'Dikemas', 
                    timestamp: Date.now(), storeOwnerId: firstItem.ownerId || 'mock'
                };
                
                await setDoc(doc(db, 'artifacts', appId, 'users', window.userId, 'orders', orderId), order);
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'orders', orderId), order);
                
                let waLink = null;
                const phone = firstItem.storePhone || '';
                if(phone) {
                    let text = `Halo *${firstItem.storeName || 'SUQNA Seller'}*,\nSaya tertarik memesan dari SUQNA:\n\n`;
                    window.cart.forEach(item => { text += `- ${item.name} (Rp ${item.price.toLocaleString('id-ID')})\n`; });
                    text += `\n*Total: Rp ${totalAmount.toLocaleString('id-ID')}*\n`;
                    
                    const buyerName = window.userProfile.name || (window.userEmail ? window.userEmail.split('@')[0] : 'Pembeli');
                    const buyerAddress = window.userProfile.address || '(Pembeli belum mengisi alamat lengkap)';
                    text += `\n📦 *Kirim ke alamat berikut:*\nNama: ${buyerName}\nAlamat: ${buyerAddress}\n`;
                    
                    text += `\nMohon informasi pembayarannya ya. Terima kasih!`;
                    let cleanPhone = phone.replace(/\D/g, '');
                    if(cleanPhone.startsWith('0')) cleanPhone = '62' + cleanPhone.substring(1); 
                    waLink = `https://wa.me/${cleanPhone}?text=${encodeURIComponent(text)}`;
                }

                window.cart = [];
                window.showModal('Pesanan Berhasil Dibuat', 'Silakan lanjutkan chat dengan penjual via WhatsApp.', waLink);
                window.navigate('account');
            }
        }

        window.updateOrderStatus = async function(orderId, newStatus) {

            if(newName) {

                if(window.tempUploadedAvatar) window.storeProfile.avatar = window.tempUploadedAvatar;

                window.showToastMessage('Banner berhasil dihapus!');

        window.saveProduct = async function() {

            window.isAddingProduct = !window.isAddingProduct;

            window.render(); 
        }

        window.editProduct = function(id) {
            const p = window.products.find(x => x.id === id);
            if(p) {
                window.editingProductData = p;
                window.tempProductImg = p.imgUrl;

                window.render();
                setTimeout(() => {
                    let parentCat = "";
                    for (const [main, subs] of Object.entries(window.categoryData)) {
                        if (subs.includes(p.category) || main === p.category) parentCat = main;
                    }
                    if(parentCat) {
                        const mainSelect = document.getElementById('maincat-select');

        // Image Compressor Otomatis
        window.handleImageBase64 = function(event, callback) {
            const file = event.target.files[0];
            if(!file) return;
            
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = function(e) {
                const img = new Image();
                img.src = e.target.result;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 800;
                    const MAX_HEIGHT = 800;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_WIDTH) {
                            height *= MAX_WIDTH / width;
                            width = MAX_WIDTH;
                        }
                    } else {
                        if (height > MAX_HEIGHT) {
                            width *= MAX_HEIGHT / height;
                            height = MAX_HEIGHT;
                        }
                    }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.7); // Kompres Kualitas JPEG 70%
                    callback(dataUrl);
                }
            };
        }

        window.showToastMessage = function(m) {
            const t = document.getElementById('toast'); 
            document.getElementById('toast-msg').innerText = m;
            t.classList.remove('hidden'); t.classList.add('animate-bounce');
            clearTimeout(window.toastTimeout);
            window.toastTimeout = setTimeout(() => { t.classList.add('hidden'); t.classList.remove('animate-bounce'); }, 2500);
        }
        
        window.showModal = function(title, desc, waLink = null) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-desc').innerText = desc;
            const waBtn = document.getElementById('modal-wa-btn');
            if(waBtn) {
                if(waLink) { waBtn.href = waLink; waBtn.classList.remove('hidden'); } 
                else { waBtn.classList.add('hidden'); }
            }
            document.getElementById('modal').classList.remove('hidden');
        }

        window.closeModal = function() { document.getElementById('modal').classList.add('hidden'); }

        window.openReviewModal = function(orderId, productId) {
            window.currentReviewOrderId = orderId;
            window.currentReviewProductId = productId;
            window.selectedRating = 0;
            document.getElementById('review-text').value = '';
            window.highlightStars(0);
            document.getElementById('review-modal').classList.remove('hidden');
        }

        window.closeReviewModal = function() {
            document.getElementById('review-modal').classList.add('hidden');
        }

        window.highlightStars = function(rating) {
            window.selectedRating = rating;
            for(let i=1; i<=5; i++) {
                const star = document.getElementById('star-'+i);
                if(star) {
                    if(i <= rating) {
                        star.classList.remove('text-gray-300');
                        star.classList.add('text-amber-400', 'fill-amber-400');
                    } else {
                        star.classList.remove('text-amber-400', 'fill-amber-400');
                        star.classList.add('text-gray-300');
                    }
                }
            }
        }

        window.submitReview = async function() {
            if(window.selectedRating === 0) return window.showToastMessage('Pilih bintang terlebih dahulu!');
            const text = document.getElementById('review-text').value;

            try {
                await updateDoc(doc(db, 'artifacts', appId, 'users', window.userId, 'orders', window.currentReviewOrderId), { status: 'Selesai' });
                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'orders', window.currentReviewOrderId), { status: 'Selesai' });

                const review = {
                    productId: window.currentReviewProductId,
                    rating: window.selectedRating,
                    comment: text,
                    reviewerName: window.userProfile.name || (window.userEmail ? window.userEmail.split('@')[0] : 'Pembeli'),
                    reviewerAvatar: window.userProfile.avatar || '',
                    timestamp: Date.now()

                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'reviews'), review);

                window.showToastMessage('Ulasan berhasil dikirim!');
                window.closeReviewModal();
            } catch (e) {
                console.error(e);
                window.showToastMessage('Gagal mengirim ulasan.');
            }
        }

        window.startBannerSlide = function() {
            clearInterval(window.bannerInterval);
            window.bannerInterval = setInterval(() => {
                if (window.banners && window.banners.length > 0) {
                    window.currentBannerIndex = (window.currentBannerIndex + 1) % window.banners.length;
                    const b = window.banners[window.currentBannerIndex];
                    const img = document.getElementById('banner-img');
                    const title = document.getElementById('banner-title');
                    const tag = document.getElementById('banner-tag');
                    if(img) {
                        img.style.opacity = 0;
                        setTimeout(() => { 
                            img.src = b.img; title.innerHTML = b.title; 
                            tag.innerHTML = b.tag; tag.className = `${b.tagColor} font-black text-[10px] tracking-widest uppercase mb-1 drop-shadow-md transition-opacity duration-300`;
                            img.style.opacity = 1; 
                        }, 300);
                    }
                }
            }, 3500);
        }
        
        window.stopBannerSlide = function() { clearInterval(window.bannerInterval); }
        
        // Render Awal
        window.render();
    </script>
